<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b9bb4"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eb0ef"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d8a657"/>
    </marker>
  </defs>

  <rect width="960" height="660" fill="#14161b"/>

  <text x="32" y="44" fill="#e6e9ef" font-size="21" font-weight="600">Cairn</text>
  <text x="32" y="68" fill="#8b9bb4" font-size="13">replicated key-value store — one node expanded, three in the cluster</text>

  <!-- ===================== client ===================== -->
  <rect x="32" y="98" width="190" height="62" rx="6" fill="#1b1f27" stroke="#2f3643"/>
  <text x="48" y="124" fill="#e6e9ef" font-size="13">cairnctl</text>
  <text x="48" y="144" fill="#6f7d94" font-size="11">follows redirects, retries</text>

  <path d="M 222 129 L 282 129" stroke="#8b9bb4" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- ===================== node box ===================== -->
  <rect x="282" y="90" width="412" height="438" rx="8" fill="#171a21" stroke="#39404f"/>
  <text x="300" y="116" fill="#5eb0ef" font-size="13" font-weight="600">node n1  (leader)</text>

  <!-- server layer -->
  <rect x="300" y="130" width="376" height="66" rx="6" fill="#1e232c" stroke="#2f3643"/>
  <text x="314" y="152" fill="#e6e9ef" font-size="12">server</text>
  <text x="314" y="171" fill="#6f7d94" font-size="10.5">PUT · GET · DELETE · CAS  ·  leader redirect</text>
  <text x="314" y="187" fill="#6f7d94" font-size="10.5">read mode: linearizable (ReadIndex) | stale (local)</text>

  <path d="M 488 196 L 488 222" stroke="#8b9bb4" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- raft layer -->
  <rect x="300" y="222" width="376" height="134" rx="6" fill="#1e232c" stroke="#3a6ea5"/>
  <text x="314" y="244" fill="#5eb0ef" font-size="12" font-weight="600">raft</text>

  <rect x="314" y="256" width="110" height="40" rx="4" fill="#232936" stroke="#2f3643"/>
  <text x="326" y="272" fill="#cdd6e3" font-size="10.5">election</text>
  <text x="326" y="287" fill="#6f7d94" font-size="9.5">randomized, pre-vote</text>

  <rect x="432" y="256" width="110" height="40" rx="4" fill="#232936" stroke="#2f3643"/>
  <text x="444" y="272" fill="#cdd6e3" font-size="10.5">replication</text>
  <text x="444" y="287" fill="#6f7d94" font-size="9.5">conflict backtrack</text>

  <rect x="550" y="256" width="112" height="40" rx="4" fill="#232936" stroke="#2f3643"/>
  <text x="562" y="272" fill="#cdd6e3" font-size="10.5">membership</text>
  <text x="562" y="287" fill="#6f7d94" font-size="9.5">one at a time</text>

  <rect x="314" y="304" width="166" height="40" rx="4" fill="#232936" stroke="#2f3643"/>
  <text x="326" y="320" fill="#cdd6e3" font-size="10.5">commit index</text>
  <text x="326" y="335" fill="#6f7d94" font-size="9.5">majority + current-term rule</text>

  <rect x="488" y="304" width="174" height="40" rx="4" fill="#232936" stroke="#2f3643"/>
  <text x="500" y="320" fill="#cdd6e3" font-size="10.5">apply loop</text>
  <text x="500" y="335" fill="#6f7d94" font-size="9.5">single owner, in order</text>

  <!-- state machine -->
  <path d="M 575 356 L 575 382" stroke="#8b9bb4" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="488" y="382" width="188" height="62" rx="6" fill="#1e232c" stroke="#2f3643"/>
  <text x="502" y="404" fill="#e6e9ef" font-size="12">kv state machine</text>
  <text x="502" y="422" fill="#6f7d94" font-size="10">sorted-key snapshots</text>
  <text x="502" y="436" fill="#6f7d94" font-size="10">per-client dedup table</text>

  <!-- storage -->
  <path d="M 390 356 L 390 382" stroke="#8b9bb4" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="300" y="382" width="172" height="62" rx="6" fill="#1e232c" stroke="#2f3643"/>
  <text x="314" y="404" fill="#e6e9ef" font-size="12">storage</text>
  <text x="314" y="422" fill="#6f7d94" font-size="10">WAL, CRC per record</text>
  <text x="314" y="436" fill="#6f7d94" font-size="10">snapshots + compaction</text>

  <!-- disk -->
  <path d="M 386 444 L 386 470" stroke="#8b9bb4" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <ellipse cx="386" cy="486" rx="56" ry="13" fill="#232936" stroke="#2f3643"/>
  <text x="386" y="490" fill="#8b9bb4" font-size="10" text-anchor="middle">fsync</text>

  <!-- transport -->
  <rect x="488" y="470" width="188" height="44" rx="6" fill="#1e232c" stroke="#2f3643"/>
  <text x="502" y="490" fill="#e6e9ef" font-size="12">transport</text>
  <text x="502" y="505" fill="#6f7d94" font-size="10">TCP · in-memory + faults</text>
  <path d="M 582 444 L 582 470" stroke="#8b9bb4" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- ===================== peers ===================== -->
  <rect x="752" y="186" width="176" height="104" rx="8" fill="#171a21" stroke="#39404f"/>
  <text x="768" y="210" fill="#cdd6e3" font-size="12">node n2  (follower)</text>
  <rect x="768" y="222" width="144" height="26" rx="4" fill="#232936" stroke="#2f3643"/>
  <text x="778" y="239" fill="#6f7d94" font-size="10">raft · kv · WAL</text>
  <text x="768" y="268" fill="#6f7d94" font-size="10">redirects writes to n1</text>
  <text x="768" y="282" fill="#6f7d94" font-size="10">applies in log order</text>

  <rect x="752" y="314" width="176" height="104" rx="8" fill="#171a21" stroke="#39404f"/>
  <text x="768" y="338" fill="#cdd6e3" font-size="12">node n3  (follower)</text>
  <rect x="768" y="350" width="144" height="26" rx="4" fill="#232936" stroke="#2f3643"/>
  <text x="778" y="367" fill="#6f7d94" font-size="10">raft · kv · WAL</text>
  <text x="768" y="396" fill="#6f7d94" font-size="10">snapshot if too far behind</text>

  <path d="M 676 262 L 752 230" stroke="#5eb0ef" stroke-width="1.6" fill="none" marker-end="url(#arrowAccent)"/>
  <path d="M 676 290 L 752 356" stroke="#5eb0ef" stroke-width="1.6" fill="none" marker-end="url(#arrowAccent)"/>
  <text x="690" y="238" fill="#5eb0ef" font-size="9.5">AppendEntries</text>
  <text x="690" y="330" fill="#5eb0ef" font-size="9.5">RequestVote</text>

  <!-- ===================== the rule ===================== -->
  <rect x="32" y="196" width="222" height="214" rx="8" fill="#171a21" stroke="#39404f"/>
  <text x="48" y="220" fill="#d8a657" font-size="12" font-weight="600">the invariant</text>
  <text x="48" y="246" fill="#8b9bb4" font-size="10.5">a write is acknowledged</text>
  <text x="48" y="262" fill="#8b9bb4" font-size="10.5">only after it is:</text>
  <text x="48" y="286" fill="#cdd6e3" font-size="10.5">1. fsynced locally</text>
  <text x="48" y="304" fill="#cdd6e3" font-size="10.5">2. on a majority</text>
  <text x="48" y="322" fill="#cdd6e3" font-size="10.5">3. of the current term</text>
  <text x="48" y="340" fill="#cdd6e3" font-size="10.5">4. and applied in order</text>
  <text x="48" y="368" fill="#6f7d94" font-size="10">drop any one of the four</text>
  <text x="48" y="382" fill="#6f7d94" font-size="10">and an acknowledged</text>
  <text x="48" y="396" fill="#6f7d94" font-size="10">write can disappear.</text>

  <!-- ===================== failure modes ===================== -->
  <rect x="32" y="430" width="222" height="196" rx="8" fill="#171a21" stroke="#39404f"/>
  <text x="48" y="454" fill="#d8a657" font-size="12" font-weight="600">injected failures</text>
  <text x="48" y="478" fill="#8b9bb4" font-size="10.5">partition · isolate · pause</text>
  <text x="48" y="496" fill="#8b9bb4" font-size="10.5">drop · duplicate · delay</text>
  <text x="48" y="514" fill="#8b9bb4" font-size="10.5">crash · restart · torn WAL</text>
  <text x="48" y="540" fill="#6f7d94" font-size="10">all seeded, so a failing</text>
  <text x="48" y="554" fill="#6f7d94" font-size="10">run reproduces exactly</text>
  <text x="48" y="582" fill="#cdd6e3" font-size="10.5">asserted afterwards:</text>
  <text x="48" y="600" fill="#6f7d94" font-size="10">≤1 leader per term,</text>
  <text x="48" y="614" fill="#6f7d94" font-size="10">commits never regress</text>

  <!-- ===================== read path callout ===================== -->
  <rect x="282" y="548" width="412" height="78" rx="8" fill="#171a21" stroke="#5a4a2a"/>
  <text x="300" y="572" fill="#d8a657" font-size="11.5" font-weight="600">why a leader cannot just answer a read</text>
  <text x="300" y="592" fill="#8b9bb4" font-size="10.5">A partitioned leader still believes it leads and still holds data.</text>
  <text x="300" y="608" fill="#8b9bb4" font-size="10.5">Nothing local reveals it. ReadIndex confirms with a quorum first,</text>
  <text x="300" y="620" fill="#8b9bb4" font-size="10.5">then waits for the state machine to reach the confirmed index.</text>

  <path d="M 752 470 L 752 500" stroke="#2f3643" stroke-width="1" fill="none"/>
  <text x="752" y="462" fill="#6f7d94" font-size="10">cluster of 3 or 5;</text>
  <text x="752" y="478" fill="#6f7d94" font-size="10">quorum = 2 or 3</text>
  <text x="752" y="500" fill="#6f7d94" font-size="10">membership changes</text>
  <text x="752" y="514" fill="#6f7d94" font-size="10">one voter at a time</text>
</svg>
